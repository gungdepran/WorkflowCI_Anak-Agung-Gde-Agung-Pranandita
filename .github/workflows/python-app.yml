name: Workflow CI & Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]


jobs:
  build:

    runs-on: ubuntu-latest

    env:
      MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_PASSWORD }}
      DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_PASSWORD }}

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.12.7
      uses: actions/setup-python@v3
      with:
        python-version: "3.12.7"
        
    - name: Check Env
      run: |
        echo "Checking python version..."
        python --version
        echo "Listing files in current directory..."
        ls -R

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install setuptools
        pip install -r requirements.txt
        
    - name: Run mlflow project
      run: |
        cd MLProject
        export MLFLOW_TRACKING_URI=./mlruns
        mlflow run . --env-manager=local
  
    - name: Get latest MLflow run_id
      run: |
        echo "Mencari Run ID terakhir..."
        echo "Training Finished. Model saved locally as 'model_output_lokal'."

 
    - name: Upload Artifacts to GitHub
      uses: actions/upload-artifact@v4
      with:
        name: trained-model
        path: |
          MLProject/model_output_lokal
          MLProject/training_confusion_matrix.png
          MLProject/metric_info.json
          MLProject/estimator.html

   
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

   
    - name: Build Docker Model
      run: |
        cd MLProject
        
        echo "Building Docker Image from local model..."
        # -m: Folder tempat model tersimpan (hasil dari save_model di script python)
        # -n: Nama image (username/repo:tag)
        
        mlflow models build-docker \
          -m "model_output_lokal" \
          -n "${{ secrets.DOCKER_USERNAME }}/submission-mlops:latest" \
          # --enable-mlserver

    - name: Tag Docker Image
      run: |
        # docker tag ${{ secrets.DOCKER_USERNAME }}/submission-mlops:latest ${{ secrets.DOCKER_USERNAME }}/submission-mlops:v1

        # Tag 1: 'latest' (Selalu update ke yang baru)
        docker tag ${{ secrets.DOCKER_USERNAME }}/submission-mlops:latest ${{ secrets.DOCKER_USERNAME }}/submission-mlops:latest
        
        # ${{ github.run_id }} adalah nomor urut otomatis dari GitHub
        docker tag ${{ secrets.DOCKER_USERNAME }}/submission-mlops:latest ${{ secrets.DOCKER_USERNAME }}/submission-mlops:${{ github.run_id }}

    - name: Push Docker Image
      run: |
        echo "Pushing image to Docker Hub..."
        docker push ${{ secrets.DOCKER_USERNAME }}/submission-mlops:latest
        # Push tag unik (history)
        docker push ${{ secrets.DOCKER_USERNAME }}/submission-mlops:${{ github.run_id }}
        
        # docker push ${{ secrets.DOCKER_USERNAME }}/submission-mlops:latest
        # docker push ${{ secrets.DOCKER_USERNAME }}/submission-mlops:v1

 
    - name: Complete job
      run: echo "CI/CD Pipeline Completed Successfully!"
